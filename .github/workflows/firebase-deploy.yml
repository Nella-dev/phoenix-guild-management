      - name: Firebase 배포
        run: |
          cd guild_app
          OUTPUT=$(firebase deploy --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive 2>&1) && echo "$OUTPUT" || {
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "is the current active version"; then
              echo "ℹ️  변경 없음 — 현재 버전이 이미 최신, 정상 종료"
              exit 0
            fi
            exit 1
          }
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
